name: Build iOS26Anim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        env:
          THEOS: ${{ github.workspace }}/theos
          CI: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl sudo
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Check SDK
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks"
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk"

      - name: Build
        run: |
          set +e
          make clean
          make package FINALPACKAGE=1 messages=yes 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "MAKE_EXIT_CODE=$status"
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOS26Anim-deb
          path: packages/*.deb
          if-no-files-found: error
