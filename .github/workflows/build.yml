name: Build .deb

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS26Anim
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        env:
          THEOS: ${{ github.workspace }}/theos
          CI: "1"
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Check Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          echo "THEOS=$THEOS"
          echo "=== SDKs ==="
          ls -la "$THEOS/sdks"
          echo "=== Clang ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make package FINALPACKAGE=1 messages=yes

      - name: Show generated packages
        run: |
          echo "Generated packages:"
          find packages -type f -name "*.deb" -print

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: iOS26Anim-deb
          path: packages/*.deb
          if-no-files-found: error
