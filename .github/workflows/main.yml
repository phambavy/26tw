name: Build .deb

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS26Anim
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            zip \
            unzip \
            git \
            libxml2 \
            libxml2-utils \
            xz-utils

      - name: Install Theos
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

      - name: Install Theos toolchain
        env:
          CI: "1"
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          bash "$THEOS/bin/install-theos"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"

          curl -L \
            https://github.com/theos/sdks/archive/refs/heads/master.zip \
            -o sdks.zip

          unzip -q sdks.zip \
            'sdks-master/iPhoneOS16.5.sdk/*'

          mv \
            sdks-master/iPhoneOS16.5.sdk \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          rm -rf sdks.zip sdks-master

          ls -la "$THEOS/sdks"

      - name: Build package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean
          make package FINALPACKAGE=1 messages=yes

      - name: Show generated packages
        run: |
          echo "Generated packages:"
          find packages -type f -name "*.deb" -print

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
          if-no-files-found: error
